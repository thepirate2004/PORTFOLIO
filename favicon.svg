<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="danger-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background for depth -->
  <rect width="32" height="32" rx="4" fill="#03050d" />
  
  <!-- Crossed Bones -->
  <g fill="url(#danger-grad)" opacity="0.8">
    <rect x="4" y="14" width="24" height="4" rx="2" transform="rotate(45 16 16)" />
    <rect x="4" y="14" width="24" height="4" rx="2" transform="rotate(-45 16 16)" />
    <!-- Bone Ends -->
    <circle cx="6" cy="6" r="2.5" />
    <circle cx="26" cy="26" r="2.5" />
    <circle cx="26" cy="6" r="2.5" />
    <circle cx="6" cy="26" r="2.5" />
  </g>

  <!-- Skull -->
  <path d="M16 4C11 4 7 8 7 13.5C7 17 8.5 20 11 21.5V24C11 25.1 11.9 26 13 26H19C20.1 26 21 25.1 21 24V21.5C23.5 20 25 17 25 13.5C25 8 21 4 16 4Z" fill="url(#danger-grad)" />
  
  <!-- Eye sockets (Hollow) -->
  <circle cx="12.5" cy="13.5" r="2.8" fill="#03050d" />
  <circle cx="19.5" cy="13.5" r="2.8" fill="#03050d" />
  
  <!-- Nose (Hollow) -->
  <path d="M16 17.5L14.5 20H17.5L16 17.5Z" fill="#03050d" />
  
  <!-- Teeth/Jaw detail -->
  <rect x="13" r="1" y="22" width="6" height="0.8" fill="#03050d" opacity="0.5" />
  <path d="M14 22V25M16 22V25M18 22V25" stroke="#03050d" stroke-width="0.6" />
</svg>
